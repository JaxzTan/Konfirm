services:
  nextjs:
    build:
      # The app lives in next/; the Dockerfile stays next to it.
      context: ./next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUI_NETWORK: ${NEXT_PUBLIC_SUI_NETWORK}
        NEXT_PUBLIC_SUI_RPC: ${NEXT_PUBLIC_SUI_RPC}
        NEXT_PUBLIC_PACKAGE_ID: ${NEXT_PUBLIC_PACKAGE_ID}
        NEXT_PUBLIC_WALRUS_AGGREGATOR: ${NEXT_PUBLIC_WALRUS_AGGREGATOR}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENOKI_API_KEY: ${NEXT_PUBLIC_ENOKI_API_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://localhost}
    image: konfirm-nextjs
    container_name: konfirm-nextjs
    # Runtime secrets. .env is gitignored and never baked into the image —
    # it is only mounted as environment at container start.
    env_file:
      - path: ./.env
        required: true
    restart: unless-stopped
    # Internal-only: nginx is the sole thing bound to the host. Reach the app
    # at https://localhost, not http://localhost:3400.
    expose:
      - '3400'
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first and the standalone server binds IPv4 only, so the IPv6
      # attempt is refused and the check fails against a healthy app.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3400/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    build:
      context: ./nginx
    image: konfirm-nginx
    container_name: konfirm-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '8443:443'
    volumes:
      # Generated by `make certs`. Read-only: nginx never writes them.
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      nextjs:
        condition: service_healthy

  # Public tunnel to nginx. Started only by `make tunnel` (compose profile),
  # never by `make all` — it publishes the whole app to the internet.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: konfirm-ngrok
    profiles: ['tunnel']
    # Port 80, not 443: ngrok terminates TLS at its own edge and forwards
    # plain HTTP, which nginx recognises via X-Forwarded-Proto rather than
    # redirecting back to HTTPS.
    #
    # NGROK_DOMAIN pins the account's reserved domain. Without it every run
    # gets a fresh random hostname, which breaks Google OAuth and Enoki — both
    # allowlist an exact origin. `$$` is escaped so compose leaves the
    # expansion to the container's shell.
    entrypoint: ['/bin/sh', '-c']
    command: ['exec ngrok http nginx:80 --log=stdout --log-format=logfmt $${NGROK_DOMAIN:+--url https://$$NGROK_DOMAIN}']
    environment:
      NGROK_AUTHTOKEN: ${NGROK:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      - nginx

networks:
  default:
    name: konfirm
