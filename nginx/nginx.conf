# WebSocket-safe Connection header: "upgrade" only when the client asked for
# it, otherwise empty so normal requests keep using keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nextjs {
    server nextjs:3400;
}

# Plain HTTP exists only to bounce to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # base64-encoded screenshots go through /api/ocr
    client_max_body_size 15m;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Next.js reads this to build absolute URLs and to mark cookies secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # OCR / LLM verdict routes can take a while.
        proxy_read_timeout 120s;
    }
}
