# WebSocket-safe Connection header: "upgrade" only when the client asked for
# it, otherwise empty so normal requests keep using keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The protocol the *client* used, which is not always the one we received.
# Behind ngrok, TLS ends at the tunnel edge and reaches us as plain HTTP with
# X-Forwarded-Proto: https. Next.js needs the client's view to build absolute
# URLs and to mark cookies secure.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Redirect to HTTPS only when the client is genuinely on plain HTTP. Without
# the second and third cases, an ngrok request (https at the edge, http to us)
# would be redirected to the https URL it already came from — an endless loop.
map "$scheme:$http_x_forwarded_proto" $needs_https_redirect {
    default       0;
    "http:"       1;
    "http:http"   1;
}

upstream nextjs {
    server nextjs:3400;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # base64-encoded screenshots go through /api/ocr
    client_max_body_size 15m;

    location / {
        # `return` is one of the two uses of `if` that are safe in a location.
        if ($needs_https_redirect) {
            return 301 https://$host$request_uri;
        }

        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # OCR / LLM verdict routes can take a while.
        proxy_read_timeout 120s;
    }
}
