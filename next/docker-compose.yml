services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUI_NETWORK: ${NEXT_PUBLIC_SUI_NETWORK}
        NEXT_PUBLIC_SUI_RPC: ${NEXT_PUBLIC_SUI_RPC}
        NEXT_PUBLIC_PACKAGE_ID: ${NEXT_PUBLIC_PACKAGE_ID}
        NEXT_PUBLIC_REGISTRY_ID: ${NEXT_PUBLIC_REGISTRY_ID}
        NEXT_PUBLIC_WALRUS_AGGREGATOR: ${NEXT_PUBLIC_WALRUS_AGGREGATOR}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_FACEBOOK_CLIENT_ID: ${NEXT_PUBLIC_FACEBOOK_CLIENT_ID}
        NEXT_PUBLIC_ENOKI_API_KEY: ${NEXT_PUBLIC_ENOKI_API_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    # Runtime secrets. .env is in .dockerignore on purpose — it is never baked
    # into the image, only mounted as environment at container start.
    env_file:
      - .env
    restart: unless-stopped
    # No nginx in front, so the app binds the host directly. Change the left
    # side to move the host port; the right side is fixed by the Dockerfile.
    ports:
      - '3400:3400'
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first and the standalone server binds IPv4 only, so the IPv6
      # attempt is refused and the check fails against a healthy app.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3400/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
